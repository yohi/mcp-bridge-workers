name: ci
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Validate local auth Compose configuration (no image build or OAuth)
        run: docker compose -f tools/local-oauth/compose.mcp-remote.yaml --profile auth config --quiet
