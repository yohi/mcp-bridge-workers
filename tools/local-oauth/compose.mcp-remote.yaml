# Connection-first: mirror successful mcp-remote OAuth scope negotiation.
# Interactive only; no service is started by npm test or CI.
# Linux-only host networking enables the browser on the same host to reach callback.
name: mcp-bridge-atlassian-local-auth
services:
  auth:
    profiles: [auth]
    build:
      context: ../..
      dockerfile: tools/local-oauth/Dockerfile.mcp-remote
    image: mcp-bridge-atlassian-auth:0.14.3
    network_mode: host
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
    volumes:
      - atlassian-oauth-negotiated-cache:/home/node/.mcp-auth
    environment:
      MCP_REMOTE_CONFIG_DIR: /home/node/.mcp-auth
    entrypoint: ["mcp-remote-client"]
    command:
      - https://mcp.atlassian.com/v2/mcp
      - "38678"
      - --transport
      - http-only
      - --host
      - localhost
      - --callback-path
      - /oauth/callback
      - --auth-timeout
      - "180"

  # Run only after mcp-remote-client OAuth has populated the separate auth cache.
  # Local listener is bound to loopback; cloudflared on this host publishes it.
  # Files bind-mounted into rootless/userns Docker can appear as uid=0 even
  # when host owner is 1000. Stage the existing 0600 bearer into a private Docker
  # named volume using a one-shot offline container; the relay stays non-root.
  relay-secret-init:
    profiles: [relay]
    image: mcp-bridge-atlassian-auth:0.14.3
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ./.relay-token
        target: /run/bootstrap/relay-token
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: relay-secret-storage
        target: /run/relay-secrets
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        set -eu
        if ! test -r /run/bootstrap/relay-token; then
          echo RELAY_SECRET_STAGE_FAILED: source_unreadable >&2
          exit 1
        fi
        if ! test -f /run/bootstrap/relay-token; then
          echo RELAY_SECRET_STAGE_FAILED: source_not_file >&2
          exit 1
        fi
        trap 'rm -f /run/relay-secrets/.token-next' EXIT
        # First create/chmod as the current owner; chown as the final metadata
        # operation. This needs CHOWN, but not FOWNER after changing UID.
        install -m 0400 /run/bootstrap/relay-token /run/relay-secrets/.token-next
        chown 1000:1000 /run/relay-secrets/.token-next
        mv -f /run/relay-secrets/.token-next /run/relay-secrets/token
        test "$(stat -c %u /run/relay-secrets/token)" = 1000
        test "$(stat -c %a /run/relay-secrets/token)" = 400
        echo RELAY_SECRET_STAGED_FOR_NODE

  relay:
    profiles: [relay]
    depends_on:
      relay-secret-init:
        condition: service_completed_successfully
    build:
      context: ../..
      dockerfile: tools/local-oauth/Dockerfile.mcp-remote
    image: mcp-bridge-atlassian-auth:0.14.3
    network_mode: host
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
    volumes:
      - atlassian-oauth-negotiated-cache:/home/node/.mcp-auth
      # Secret is staged by an offline, one-shot container, and remains
      # readable by the non-root node UID despite userns/rootless bind mapping.
      - type: volume
        source: relay-secret-storage
        target: /run/relay-secrets
        read_only: true
    environment:
      MCP_REMOTE_CONFIG_DIR: /home/node/.mcp-auth
      RELAY_SECRET_FILE: /run/relay-secrets/token
    entrypoint: ["node", "/opt/mcp-relay/server.mjs"]

  # Explicit opt-in only: Cloudflare Tunnel is NOT started by the relay profile.
  # The actual Tunnel token is a pre-existing 0600 host file, never a CLI arg
  # or a Compose environment variable.
  cloudflared-token-init:
    profiles: [tunnel]
    image: mcp-bridge-atlassian-auth:0.14.3
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ./.cloudflared-token
        target: /run/bootstrap/tunnel-token
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: cloudflared-token-storage
        target: /run/cloudflared-tokens
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        set -eu
        if ! test -r /run/bootstrap/tunnel-token; then
          echo CLOUDFLARED_TOKEN_STAGE_FAILED: source_unreadable >&2
          exit 1
        fi
        if ! test -f /run/bootstrap/tunnel-token; then
          echo CLOUDFLARED_TOKEN_STAGE_FAILED: source_not_file >&2
          exit 1
        fi
        trap 'rm -f /run/cloudflared-tokens/.token-next' EXIT
        install -m 0400 /run/bootstrap/tunnel-token /run/cloudflared-tokens/.token-next
        chown 1000:1000 /run/cloudflared-tokens/.token-next
        mv -f /run/cloudflared-tokens/.token-next /run/cloudflared-tokens/token
        test "$(stat -c %u /run/cloudflared-tokens/token)" = 1000
        test "$(stat -c %a /run/cloudflared-tokens/token)" = 400
        test -s /run/cloudflared-tokens/token
        echo CLOUDFLARED_TOKEN_STAGED_FOR_NONROOT

  # Uses host networking ONLY to reach the existing loopback-only relay at
  # 127.0.0.1:18787. No host installation, socket mount or published port.
  # Protect the public hostname with Access Service Auth BEFORE routing it.
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.10.1
    user: "1000:1000"
    network_mode: host
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      cloudflared-token-init:
        condition: service_completed_successfully
    volumes:
      - type: volume
        source: cloudflared-token-storage
        target: /run/cloudflared-tokens
        read_only: true
    command:
      - tunnel
      - --no-autoupdate
      - --loglevel
      - info
      - run
      - --token-file
      - /run/cloudflared-tokens/token

volumes:
  atlassian-oauth-negotiated-cache:
  relay-secret-storage:
  cloudflared-token-storage:

